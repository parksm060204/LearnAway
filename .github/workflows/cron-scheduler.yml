name: LearnAway Background Cron Runner

# Triggers scheduled jobs when running on Vercel Hobby plan
# Vercel Hobby is restricted to 1 cron execution per day.
# This GitHub Actions workflow runs free of charge on GitHub's hosted runners
# to trigger hourly reminders and 15-minute temporary PDF cleanups.

on:
  schedule:
    # Every hour on the hour (for hourly KST review notifications)
    - cron: '0 * * * *'
    # Every 15 minutes (for temporary PDF storage cleanup)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target endpoint to invoke'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - reminders
          - cleanup

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Daily Review Reminders (Hourly)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'reminders' || github.event.schedule == '0 * * * *' }}
        env:
          APP_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping reminders: VERCEL_DEPLOYMENT_URL or CRON_SECRET not configured in repository secrets."
            exit 0
          fi
          echo "Invoking $APP_URL/api/reminders/cron ..."
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 10 \
            --max-redirs 0 \
            -X GET "$APP_URL/api/reminders/cron" \
            -H "Authorization: Bearer $CRON_SECRET")
          CURL_EXIT=$?

          if [ $CURL_EXIT -ne 0 ]; then
            echo "::error::Network error: reminders curl request failed with exit code $CURL_EXIT"
            exit 1
          fi

          if ! [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
            echo "::error::Invalid HTTP status code received: '$HTTP_CODE'"
            exit 1
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Reminders cron failed with HTTP $HTTP_CODE"
            node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
                console.log('Error details:', data.error || data.message || 'No details');
              } catch {
                console.log('Non-JSON error response');
              }
            " "$BODY_FILE"
            exit 1
          fi

          node -e "
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            } catch (e) {
              console.error('::error::Invalid JSON response: ' + e.message);
              process.exit(1);
            }
            if (data.success !== true) {
              console.error('::error::Reminders API returned success=false: ' + (data.error || 'Unknown error'));
              process.exit(1);
            }
            const failed = Number(data.failed || 0);
            console.log('Reminders summary: totalEvaluated=' + (data.totalEvaluated ?? 0) +
                        ', dispatched=' + (data.dispatched ?? 0) +
                        ', skipped=' + (data.skipped ?? 0) +
                        ', failed=' + failed);
            if (failed > 0) {
              console.log('::warning::Reminders executed with partial failures (' + failed + ' failed notifications).');
            } else {
              console.log('All reminder tasks completed successfully.');
            }
          " "$BODY_FILE"

      - name: Trigger Temporary PDF Cleanup (Every 15 min)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'cleanup' || github.event.schedule == '*/15 * * * *' }}
        env:
          APP_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping temp PDF cleanup: VERCEL_DEPLOYMENT_URL or CRON_SECRET not configured in repository secrets."
            exit 0
          fi
          echo "Invoking $APP_URL/api/cron/cleanup-temp-pdf ..."
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 10 \
            --max-redirs 0 \
            -X GET "$APP_URL/api/cron/cleanup-temp-pdf" \
            -H "Authorization: Bearer $CRON_SECRET")
          CURL_EXIT=$?

          if [ $CURL_EXIT -ne 0 ]; then
            echo "::error::Network error: temp PDF cleanup curl request failed with exit code $CURL_EXIT"
            exit 1
          fi

          if ! [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
            echo "::error::Invalid HTTP status code received: '$HTTP_CODE'"
            exit 1
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Temp PDF cleanup cron failed with HTTP $HTTP_CODE"
            node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
                console.log('Error details:', data.error || data.message || 'No details');
              } catch {
                console.log('Non-JSON error response');
              }
            " "$BODY_FILE"
            exit 1
          fi

          node -e "
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            } catch (e) {
              console.error('::error::Invalid JSON response: ' + e.message);
              process.exit(1);
            }
            if (data.success !== true) {
              console.error('::error::Temp PDF cleanup returned success=false: ' + (data.error || 'Unknown error'));
              process.exit(1);
            }
            const failedCount = Number(data.failedCount || 0);
            console.log('Cleanup summary: claimed=' + (data.claimedCount ?? 0) +
                        ', cleaned=' + (data.cleanedCount ?? 0) +
                        ', quarantined=' + (data.quarantinedCount ?? 0) +
                        ', failed=' + failedCount);
            if (failedCount > 0) {
              console.log('::warning::Temp PDF cleanup executed with partial failures (' + failedCount + ' jobs failed).');
            } else {
              console.log('All PDF cleanup tasks completed successfully.');
            }
          " "$BODY_FILE"
